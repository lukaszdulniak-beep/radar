<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Radar</title>
<style>
:root { --bg: #f3f5f8; --surface: #ffffff; --ink: #15202b; --muted: #5d6b7a; --line: #d6dde6; --accent: #1f4fd1; --accent-ink: #ffffff; --bad: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg: #11161b; --surface: #1a2128; --ink: #e6ebf0; --muted: #98a6b4; --line: #2c3741; --accent: #7ea2ff; --accent-ink: #0e1420; --bad: #ef6a5a; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display: grid; place-items: center; padding-inline: 16px; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input[type=password] { width: 100%; padding: 10px 12px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
label { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
button { padding: 10px 12px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button[disabled] { opacity: .6; cursor: wait; }
.err { color: var(--bad); min-height: 1.2em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Radar</h1>
  <p>Private page. Enter the password to open it.</p>
  <input type="text" name="username" value="radar" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Password" required autofocus>
  <label><input id="rem" type="checkbox"> Remember on this device</label>
  <button id="go" type="submit">Open</button>
  <p class="err" id="err" role="alert"></p>
</form>

function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function unlock(pw) {
